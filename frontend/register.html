<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HireReady</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
    <div class="auth-box">
        <h2>Create An Account</h2>
        <p class="auth-sub">Join HireReady and start practicing</p>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullname" placeholder="Your Name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="username@gmail.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <div class="form-group">
            <label>Year of Study</label>
            <input type="number" id="yearOfStudy" placeholder="4">
        </div>

        <button class="btn-primary btn-full" onclick="register()">Register</button>

        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>

        <script src="js/auth.js"></script>
    </div>
</div>
</body>
</html>
