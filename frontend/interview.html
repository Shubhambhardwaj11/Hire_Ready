<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview | HireReady</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">HireReady</div>
        <div class="nav-links">
            <button class="btn-logout" onclick="window.location.href='dashboard.html'">← Back</button>
        </div>
    </nav>

    <div class="interview-container">

        <!-- Loading Screen -->
        <div id="loading-screen">
            <p>🤖 Generating your questions...</p>
        </div>

        <!-- Question Screen -->
        <div id="question-screen" style="display:none">
            <div class="progress">Question <span id="current-q">1</span>/10</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question-box">
                <p id="question-text"></p>
            </div>
            <textarea id="answer-input" placeholder="Type your answer here..."></textarea>
            <div class="q-buttons">
                <button class="btn-outline" onclick="prevQuestion()">← Back</button>
                <button class="btn-primary" id="next-btn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

    </div>

    <script src="js/interview.js"></script>
</body>
</html>
