<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireReady | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
    <div class="auth-box">
        <h2>Welcome Back</h2>
        <p class="auth-sub">Login to continue practicing</p>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="username@gmail.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn-primary btn-full" onclick="login()">Login</button>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
